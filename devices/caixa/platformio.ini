; Caixa de som da Faísca: XIAO ESP32-S3 Sense (microfone PDM na placa),
; MAX98357A (I2S) + alto-falante, botão e anel de LED WS2812.
[env:caixa]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
lib_deps =
    bblanchon/ArduinoJson@7.2.1
    adafruit/Adafruit NeoPixel@1.12.3
