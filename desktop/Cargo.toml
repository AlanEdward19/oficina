[package]
name = "oficina-desktop"
version = "0.1.0"
edition = "2024"
description = "A Faísca no Windows e no Linux: pet, conversa e ícone na bandeja."

[[bin]]
name = "Oficina"
path = "src/main.rs"

[dependencies]
serde_json = "1"
tao = "0.37"
tray-icon = "0.26"
wry = "0.57"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
