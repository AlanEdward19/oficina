<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-label="Oficina.app and future clients talk to the oficinad core, which drives the claude CLI for quick chat, cloud agents and agents on your machines">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8d8da0"/></marker></defs>
<rect width="1280" height="500" rx="26" fill="#14141b"/><g font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<rect x="40" y="50" width="300" height="200" rx="18" fill="#FF9E29" fill-opacity="0.14" stroke="#FF9E29" stroke-opacity=".8" stroke-width="1.5"/><text x="62" y="90" font-size="22" font-weight="800" fill="#fff">Oficina.app</text><text x="62" y="120" font-size="16" fill="#b9b9c7">Swift · AppKit · Core Animation</text><text x="62" y="144" font-size="16" fill="#b9b9c7">Pet, chat, Dock, notch</text><text x="62" y="168" font-size="16" fill="#b9b9c7">Agent factory screens</text>
<rect x="40" y="290" width="300" height="160" rx="18" fill="#B56CFF" fill-opacity="0.14" stroke="#B56CFF" stroke-opacity=".8" stroke-width="1.5"/><text x="62" y="330" font-size="22" font-weight="800" fill="#fff">Next clients</text><text x="62" y="360" font-size="16" fill="#b9b9c7">Echo, kitchen panel, phone</text><text x="62" y="384" font-size="16" fill="#b9b9c7">Same local API</text>
<rect x="470" y="50" width="330" height="400" rx="18" fill="#FF5C8A" fill-opacity="0.14" stroke="#FF5C8A" stroke-opacity=".8" stroke-width="1.5"/><text x="492" y="90" font-size="22" font-weight="800" fill="#fff">oficinad</text><text x="492" y="120" font-size="16" fill="#b9b9c7">Rust core, always on</text><text x="492" y="144" font-size="16" fill="#b9b9c7">Queue and approvals</text><text x="492" y="168" font-size="16" fill="#b9b9c7">Conversations and sessions</text><text x="492" y="192" font-size="16" fill="#b9b9c7">Agents, teams, missions</text><text x="492" y="216" font-size="16" fill="#b9b9c7">Model router: no tokens spent</text><text x="492" y="240" font-size="16" fill="#b9b9c7">Mind: spiking net and memory</text><text x="492" y="264" font-size="16" fill="#b9b9c7"></text><text x="492" y="288" font-size="16" fill="#b9b9c7">HTTP + SSE on 127.0.0.1</text><text x="492" y="312" font-size="16" fill="#b9b9c7">Bearer token</text>
<rect x="930" y="50" width="310" height="110" rx="18" fill="#20C997" fill-opacity="0.14" stroke="#20C997" stroke-opacity=".8" stroke-width="1.5"/><text x="952" y="90" font-size="22" font-weight="800" fill="#fff">Quick chat</text><text x="952" y="120" font-size="16" fill="#b9b9c7">Your Claude login, no API key</text>
<rect x="930" y="195" width="310" height="110" rx="18" fill="#5B8CFF" fill-opacity="0.14" stroke="#5B8CFF" stroke-opacity=".8" stroke-width="1.5"/><text x="952" y="235" font-size="22" font-weight="800" fill="#fff">Cloud agents</text><text x="952" y="265" font-size="16" fill="#b9b9c7">claude --cloud</text>
<rect x="930" y="340" width="310" height="110" rx="18" fill="#22B8CF" fill-opacity="0.14" stroke="#22B8CF" stroke-opacity=".8" stroke-width="1.5"/><text x="952" y="380" font-size="22" font-weight="800" fill="#fff">Your machines</text><text x="952" y="410" font-size="16" fill="#b9b9c7">This Mac or any online one</text>
